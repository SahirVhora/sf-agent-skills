name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install PyYAML
      - name: Validate catalog and skill files
        run: python scripts/validate.py
      - name: Evaluate flagship evidence contracts
        run: python scripts/evaluate_flagship_skills.py
